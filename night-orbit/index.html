<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Night Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one landscape "stage" (rotated 90° on portrait phones) holding the thermal canvas, thumb controls and menu sheets */
:root{
  --bg:#060807; --ink:#e6ebe4; --dim:#8d978d; --line:rgba(230,235,228,.22);
  --panel:rgba(9,13,11,.9); --amber:#f2b34a;
  --display:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);overscroll-behavior:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;touch-action:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  --il:0px;--ir:0px;--it:0px;--ib:0px;background:var(--bg)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#view.blackhot{filter:invert(1)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.ctl{position:absolute;display:flex;gap:12px;align-items:flex-end;touch-action:none}
#ctlL{left:calc(16px + var(--il));bottom:calc(14px + var(--ib));flex-direction:column;align-items:flex-start}
#stick{width:118px;height:118px;border-radius:50%;border:1.5px solid var(--line);background:rgba(6,8,7,.4);position:relative;touch-action:none}
#stick::before,#stick::after{content:"";position:absolute;background:var(--line)}
#stick::before{left:50%;top:14px;bottom:14px;width:1px}
#stick::after{top:50%;left:14px;right:14px;height:1px}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--ink);background:rgba(230,235,228,.18);pointer-events:none;z-index:1}
#stick.on #knob{background:rgba(230,235,228,.38)}
#ctlR{right:calc(16px + var(--ir));bottom:calc(14px + var(--ib))}
.weps{display:flex;flex-direction:column;gap:6px}
.wep{width:62px;height:40px;border:1px solid var(--line);background:rgba(6,8,7,.55);letter-spacing:.06em;font-size:14px}
.wep.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#fireBtn{width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:rgba(6,8,7,.45);font-size:15px;letter-spacing:.18em}
#fireBtn.held{background:rgba(230,235,228,.25)}
#flareBtn{width:92px;height:56px;border:1px solid var(--amber);color:var(--amber);background:rgba(6,8,7,.55);letter-spacing:.14em;font-size:13px;position:relative;overflow:hidden}
#flareBtn .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
#zoomCtl{position:absolute;right:calc(14px + var(--ir));top:calc(50% - 40px);display:flex;flex-direction:column;gap:8px}
#zoomCtl button{width:44px;height:44px;border:1px solid var(--line);background:rgba(6,8,7,.55);font-size:22px;line-height:1;touch-action:none}
#zoomCtl button.held{background:rgba(230,235,228,.25)}
#pauseBtn{position:absolute;top:calc(12px + var(--it));right:calc(12px + var(--ir));width:42px;height:42px;border:1px solid var(--line);background:rgba(6,8,7,.55);font-size:14px;letter-spacing:.1em}

.overlay{position:absolute;inset:0;overflow:auto;display:flex;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:radial-gradient(ellipse at center,rgba(6,8,7,.45),rgba(6,8,7,.9));
  padding:calc(16px + var(--it)) calc(16px + var(--ir)) calc(16px + var(--ib)) calc(16px + var(--il))}
.sheet{margin:auto;width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;-webkit-user-select:text;user-select:text}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,9vw,72px);line-height:.9;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1;margin:0;text-wrap:balance}
p{margin:0;line-height:1.55;font-size:14px;max-width:64ch}
.muted{color:var(--dim)}
.hint{border-left:2px solid var(--amber);padding-left:10px;color:var(--amber);font-size:13px}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:1px solid var(--line);column-gap:18px}
.mrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mrow:hover:not(:disabled){background:rgba(230,235,228,.06)}
.mrow:disabled{opacity:.38;cursor:not-allowed}
.mrow .n{color:var(--dim);font-variant-numeric:tabular-nums}
.mrow .nm{font-size:16px;letter-spacing:.04em;min-width:0}
.mrow .nm small{display:block;font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border:1px solid var(--line);padding:4px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mrow .st{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.medal{border:1px solid var(--line);padding:8px 10px;font-size:12px;line-height:1.35}
.medal b{display:block;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.medal.got{border-color:var(--amber)} .medal.got b{color:var(--amber)}
.medal:not(.got){color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--ink);background:none;padding:12px 18px;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 12px;font-size:11px;border-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stats span{font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.stats b{font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.keys{font-size:12px;line-height:1.7;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.keys kbd{font-family:var(--mono);color:var(--ink)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.orders div{border:1px solid var(--line);padding:8px;text-align:center}
.orders div.threat{border-color:var(--amber)}
.orders b{display:block;font-weight:400;font-size:22px}
.orders span{font-size:10px;letter-spacing:.16em;color:var(--dim)}
.fail{color:var(--amber)}
</style>

<div id="probe"></div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ctlL" class="ctl" hidden>
    <button id="flareBtn" type="button">FLARES<span class="cd"></span></button>
    <div id="stick" aria-label="Camera joystick"><div id="knob"></div></div>
  </div>
  <div id="ctlR" class="ctl" hidden>
    <div class="weps">
      <button class="wep" data-w="0" type="button">25</button>
      <button class="wep" data-w="3" type="button">30</button>
      <button class="wep on" data-w="1" type="button">40</button>
      <button class="wep" data-w="2" type="button">105</button>
    </div>
    <button id="fireBtn" type="button">FIRE</button>
  </div>
  <div id="zoomCtl" hidden><button id="zIn" type="button" aria-label="Zoom in">+</button><button id="zOut" type="button" aria-label="Zoom out">−</button></div>
  <button id="pauseBtn" type="button" aria-label="Pause" hidden>II</button>
  <div id="menu" class="overlay"><div class="sheet" id="menuSheet"></div></div>
  <div id="result" class="overlay" hidden><div class="sheet" id="resultSheet"></div></div>
  <div id="pause" class="overlay" hidden><div class="sheet" id="pauseSheet"></div></div>
</div>

<script>
(()=>{
const TAU=Math.PI*2, W=2000;
const ROADS_X=[260,760,1240,1740], ROADS_Y=[240,740,1260,1760];
const stage=document.getElementById('stage'), view=document.getElementById('view'), ctx=view.getContext('2d');
const probe=document.getElementById('probe');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hyp=Math.hypot, clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=Math.random;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rnd;

/* ---------- save ---------- */
const SAVE_KEY='night-orbit-v1';
let save={unlocked:1,best:{},medals:{},flares:0,blackhot:false,muted:false,orient:'cw',sens:'med'};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
view.classList.toggle('blackhot',!!save.blackhot);

/* ---------- landscape stage ---------- */
let VW=0,VH=0,DPR=1,MODE=0,inset={t:0,r:0,b:0,l:0};
function layout(){
  const sw=window.innerWidth,sh=window.innerHeight,portrait=sh>sw*1.05;
  const cs=getComputedStyle(probe),si={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  MODE=(!portrait||save.orient==='off')?0:(save.orient==='ccw'?-1:1);
  if(MODE===0){VW=sw;VH=sh;stage.style.transform='none';inset=si}
  else if(MODE===1){VW=sh;VH=sw;stage.style.transform=`translate(${sw}px,0) rotate(90deg)`;inset={l:si.t,r:si.b,t:si.r,b:si.l}}
  else{VW=sh;VH=sw;stage.style.transform=`translate(0,${sh}px) rotate(-90deg)`;inset={l:si.b,r:si.t,t:si.l,b:si.r}}
  stage.style.width=VW+'px';stage.style.height=VH+'px';
  for(const k of ['l','r','t','b'])stage.style.setProperty('--i'+k,inset[k]+'px');
  DPR=Math.min(2,window.devicePixelRatio||1);view.width=Math.round(VW*DPR);view.height=Math.round(VH*DPR);
}
function toStage(dx,dy){return MODE===1?[dy,-dx]:MODE===-1?[-dy,dx]:[dx,dy]}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,300));
layout();

/* ---------- sprites ---------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function radial(stops){const c=mk(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
const GLOW=radial([[0,'rgba(255,255,255,1)'],[.22,'rgba(255,255,255,.5)'],[1,'rgba(255,255,255,0)']]);
const SMOKE=radial([[0,'rgba(178,184,178,.9)'],[.5,'rgba(160,166,160,.45)'],[1,'rgba(150,156,150,0)']]);
const DARK=radial([[0,'rgba(40,44,41,.9)'],[.55,'rgba(40,44,41,.45)'],[1,'rgba(40,44,41,0)']]);
const CLOUD=radial([[0,'rgba(150,156,150,.85)'],[.6,'rgba(140,146,140,.35)'],[1,'rgba(130,136,130,0)']]);
const NOISE=(()=>{const c=mk(128,128),g=c.getContext('2d'),d=g.createImageData(128,128);
  for(let i=0;i<d.data.length;i+=4){const v=rnd()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
const SCAN=(()=>{const c=mk(2,3),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,2,2,1);return c})();
const noisePat=ctx.createPattern(NOISE,'repeat'),scanPat=ctx.createPattern(SCAN,'repeat');
function glow(x,y,r,a){if(a<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(GLOW,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function sprite(img,x,y,r,a){if(a<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(img,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function heatCol(t,span){const v=Math.round(92+163*Math.exp(-3*t/span));return `rgb(${v},${Math.min(255,v+3)},${v})`}

/* ---------- terrain ---------- */
let terrain=null,tctx=null,compounds=[],BLD=[];
function buildTerrain(biome){
  terrain=mk(W,W);tctx=terrain.getContext('2d');const t=tctx;compounds=[];BLD=[];
  const base={valley:'#2a2e2b',desert:'#323530',city:'#272a28',mountains:'#1f2321'}[biome]||'#2a2e2b';
  t.fillStyle=base;t.fillRect(0,0,W,W);
  t.lineCap='round';t.lineJoin='round';
  const tree=(x,y,rr)=>{const r=rr||2.5+R()*5;t.fillStyle='#151816';t.beginPath();t.arc(x+1.5,y+1.5,r,0,TAU);t.fill();t.fillStyle=R()<.5?'#434a45':'#3a403c';t.beginPath();t.arc(x,y,r,0,TAU);t.fill();
    t.fillStyle='rgba(90,98,92,.5)';t.beginPath();t.arc(x-r*.3,y-r*.3,r*.45,0,TAU);t.fill()};
  const pine=(x,y)=>{const r=1.8+R()*2.4;t.fillStyle='#0f1110';t.beginPath();t.arc(x+2,y+2,r,0,TAU);t.fill();t.fillStyle=R()<.5?'#3d443f':'#343b36';t.beginPath();
    for(let k=0;k<8;k++){const a=k/8*TAU,q=k%2?r*.5:r;t.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}t.closePath();t.fill()};
  const palm=(x,y)=>{t.strokeStyle='#4a514c';t.lineWidth=1.2;t.beginPath();const o=R();for(let k=0;k<6;k++){const a=k/6*TAU+o;t.moveTo(x,y);t.lineTo(x+Math.cos(a)*5,y+Math.sin(a)*5)}t.stroke();t.fillStyle='#5a615c';t.beginPath();t.arc(x,y,1.3,0,TAU);t.fill()};
  const winding=(w,c1,c2)=>{const pts=[];let y=W*(.3+R()*.4);for(let x=-80;x<=W+80;x+=80){y+=(R()-.5)*120;y=clamp(y,150,W-150);pts.push([x,y])}
    const path=()=>{t.beginPath();t.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const p=pts[i-1],q=pts[i];t.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}};
    t.strokeStyle=c1;t.lineWidth=w;path();t.stroke();t.strokeStyle=c2;t.lineWidth=w*.45;path();t.stroke();t.strokeStyle='rgba(90,96,90,.25)';t.lineWidth=2;path();t.stroke();return pts};
  const building=(bx,by,bw,bh,city)=>{
    t.fillStyle='#141615';t.fillRect(bx+(city?4:3),by+(city?4:3),bw,bh);
    const g=city?(66+R()*26)|0:79;t.fillStyle=`rgb(${g},${g+6},${g+1})`;t.fillRect(bx,by,bw,bh);
    t.strokeStyle='#6f766f';t.lineWidth=1;t.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    t.strokeStyle='rgba(0,0,0,.25)';t.strokeRect(bx+2.5,by+2.5,bw-5,bh-5);
    if(R()<.5){t.fillStyle='#9da39e';t.fillRect(bx+2+R()*(bw-7),by+2+R()*(bh-7),3,3)}
    if(R()<.35){t.fillStyle='#636a64';t.beginPath();t.arc(bx+bw-5,by+5,2.6,0,TAU);t.fill()}
    if(R()<.3){t.fillStyle='#3c423e';t.fillRect(bx+3,by+bh-8,6,5)}
    if(city&&R()<.3){t.strokeStyle='rgba(150,156,150,.25)';t.beginPath();t.moveTo(bx+bw/2,by+2);t.lineTo(bx+bw/2,by+bh-2);t.stroke()}
    BLD.push({x:bx,y:by,w:bw,h:bh,hp:3,alive:true,warm:R()<.35});
  };
  if(biome==='valley'){
    for(let i=0;i<170;i++){
      const x=R()*W,y=R()*W,w=80+R()*240,h=80+R()*240,g=(33+R()*26)|0,vert=R()<.5;
      t.save();t.translate(x,y);t.rotate((R()-.5)*.25);
      t.fillStyle=`rgb(${g},${g+4},${g+1})`;t.fillRect(-w/2,-h/2,w,h);
      t.strokeStyle='rgba(0,0,0,.15)';t.lineWidth=1.2;t.beginPath();
      const L=vert?w:h;for(let k=-L/2;k<L/2;k+=5+R()*2){if(vert){t.moveTo(k,-h/2);t.lineTo(k,h/2)}else{t.moveTo(-w/2,k);t.lineTo(w/2,k)}}
      t.stroke();t.strokeStyle='rgba(0,0,0,.25)';t.lineWidth=1.5;t.strokeRect(-w/2,-h/2,w,h);
      if(R()<.35){const n=2+(R()*6|0);for(let k=0;k<n;k++){const hx=(R()-.5)*w*.8,hy=(R()-.5)*h*.8,r=3+R()*2;
        t.fillStyle='#141615';t.beginPath();t.arc(hx+2,hy+2,r,0,TAU);t.fill();t.fillStyle='#5b615c';t.beginPath();t.arc(hx,hy,r,0,TAU);t.fill()}}
      t.restore();
    }
    for(let i=0;i<5;i++){const horiz=R()<.5,c=200+R()*(W-400);t.strokeStyle='#171a18';t.lineWidth=5;t.beginPath();
      if(horiz){t.moveTo(0,c);t.lineTo(W,c+(R()-.5)*80)}else{t.moveTo(c,0);t.lineTo(c+(R()-.5)*80,W)}t.stroke();
      t.strokeStyle='rgba(120,126,120,.18)';t.lineWidth=1;t.stroke()}
    const pts=winding(72,'#1e211f','#121413');
    for(let i=0;i<pts.length*16;i++){const p=pts[(R()*pts.length)|0];tree(p[0]+(R()-.5)*140,p[1]+(R()-.5)*120)}
    for(let c=0;c<44;c++){const cx=R()*W,cy=R()*W;for(let i=0;i<22;i++)tree(cx+(R()-.5)*90,cy+(R()-.5)*90)}
    t.strokeStyle='rgba(120,126,120,.2)';t.lineWidth=2.4;
    for(let i=0;i<28;i++){let x=R()*W,yy=R()*W,a=R()*TAU;t.beginPath();t.moveTo(x,yy);for(let k=0;k<36;k++){a+=(R()-.5)*.5;x+=Math.cos(a)*14;yy+=Math.sin(a)*14;t.lineTo(x,yy)}t.stroke()}
  }else if(biome==='desert'){
    for(let i=0;i<40;i++){const x=R()*W,y=R()*W,r=80+R()*200,g=t.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,.2)');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.fillRect(x-r,y-r,r*2,r*2)}
    const ra=R()*TAU;
    for(let i=0;i<1500;i++){const x=R()*W,y=R()*W,a=ra+(R()-.5)*.5,L=30+R()*90,bend=(R()-.5)*20,nx=-Math.sin(a),ny=Math.cos(a),mx=x+Math.cos(a)*L/2,my=y+Math.sin(a)*L/2,ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;
      t.strokeStyle='rgba(0,0,0,.15)';t.lineWidth=1.4;t.beginPath();t.moveTo(x,y);t.quadraticCurveTo(mx+nx*bend,my+ny*bend,ex,ey);t.stroke();
      t.strokeStyle='rgba(255,255,255,.05)';t.beginPath();t.moveTo(x+nx*2,y+ny*2);t.quadraticCurveTo(mx+nx*(bend+2),my+ny*(bend+2),ex+nx*2,ey+ny*2);t.stroke()}
    const pts=winding(90,'#3b3f39','#2b2e2a');
    for(let i=0;i<pts.length*6;i++){const p=pts[(R()*pts.length)|0];palm(p[0]+(R()-.5)*120,p[1]+(R()-.5)*110)}
    for(let i=0;i<1600;i++){t.fillStyle=R()<.5?'#444a45':'#3b403c';t.beginPath();t.arc(R()*W,R()*W,.8+R()*1.4,0,TAU);t.fill()}
  }else if(biome==='mountains'){

let startBuf=null,startDecoding=null;
function decodeStartClip(){
  if(!AC||startBuf||startDecoding)return startDecoding;
  try{const bin=atob(START_CLIP_B64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    startDecoding=new Promise(res=>{AC.decodeAudioData(u8.buffer,b=>{startBuf=b;res(b)},()=>res(null))})}catch(e){startDecoding=Promise.resolve(null)}

}
function playStartClip(delay){
  if(!AC)return;

    src.buffer=startBuf;g.gain.value=1.15;src.connect(g);g.connect(master);src.start(t);
    nz({type:'bandpass',f:2300,q:.7,vol:.08,dur:.14,delay:delay-.12});nz({type:'bandpass',f:2300,q:.7,vol:.06,dur:.1,delay:delay+startBuf.duration})};

}

function fieldSpot(near,minD,maxD){
  for(let k=0;k<80;k++){const a=R()*TAU,d=minD+R()*(maxD-minD),x=near.x+Math.cos(a)*d,y=near.y+Math.sin(a)*d;
    if(x<60||y<60||x>W-60||y>W-60)continue;
    if(ROADS_X.some(r=>Math.abs(r-x)<26)||ROADS_Y.some(r=>Math.abs(r-y)<26))continue;
    if(compounds.some(c=>Math.abs(c.x-x)<c.s/2+14&&Math.abs(c.y-y)<c.s/2+14))continue;
    if(BLD.some(b=>x>b.x-9&&x<b.x+b.w+9&&y>b.y-9&&y<b.y+b.h+9))continue;

}

    if(d%30===0){const v=((d%360)+360)%360;txt(v===0?'N':v===90?'E':v===180?'S':v===270?'W':String(v/10).padStart(2,'0'),x,ty-8,'center')}}

  pauseSheet.querySelector('#resBtn').addEventListener('click',resume);
  pauseSheet.querySelector('#rstBtn').addEventListener('click',()=>start(G.mi));
  pauseSheet.querySelector('#mnuBtn').addEventListener('click',toMenu);
  bindToggles(pauseSheet,renderPause);
}
function resume(){if(state!=='pause')return;state='play';pauseEl.hidden=true;audioInit();engineLevel()}
function finish(){
  state='end';showControls(false);input.btn=input.key=input.mouse=false;stickEnd();gatSet(false);engineLevel();
  if(document.exitPointerLock&&locked())document.exitPointerLock();
  const win=G.result.win,earned=[],award=id=>{if(!save.medals[id]){save.medals[id]=true;earned.push(id)}};
  if(win){G.score+=Math.round(G.time)*10+Math.round(G.hull)*5;
    save.unlocked=Math.min(MISSIONS.length,Math.max(save.unlocked,G.mi+2));
    save.best[G.mi]=Math.max(save.best[G.mi]??-1e9,G.score);
    if(G.mi===0)award('first');if(G.stats.ff===0&&G.stats.lost===0)award('clean');if(G.hull>=100)award('untouched');
    if(Object.keys(save.best).length>=MISSIONS.length)award('tour')}
  if(G.stats.multi)award('multi');
  save.flares=(save.flares||0)+G.stats.flares;if(save.flares>=5)award('flares');
  persist();
  const acc=G.stats.shots?Math.round(100*G.stats.hits/G.stats.shots):0,used=G.M.time-G.time;
  const next=win&&G.mi<MISSIONS.length-1;
  resultSheet.innerHTML=`
    <div class="eyebrow">${esc(G.M.name)}</div>
    <h2 class="${win?'':'fail'}">${win?'Area secure':'Mission failed'}</h2>
    <p>${esc(G.result.reason)}</p>
    <div class="stats">
      <div><span>Score</span><b>${G.score}</b></div><div><span>Kills</span><b>${G.stats.kills}</b></div>
      <div><span>Accuracy</span><b>${acc}%</b></div><div><span>Airframe</span><b>${Math.round(G.hull)}%</b></div>
      <div><span>Friendly hits</span><b>${G.stats.ff}</b></div><div><span>Patrol lost</span><b>${G.stats.lost}</b></div>
      <div><span>Missiles beaten</span><b>${G.stats.flares}</b></div><div><span>Time used</span><b>${Math.floor(used/60)}:${String(Math.floor(used%60)).padStart(2,'0')}</b></div>
    </div>
    ${earned.length?`<div class="eyebrow">New medals</div><div class="medals">${earned.map(id=>{const m=MEDALS.find(x=>x.id===id);return `<div class="medal got"><b>${m.name}</b>${m.desc}</div>`}).join('')}</div>`:''}
    <div class="row">${next?'<button class="btn primary" id="nxtBtn">Next mission</button>':''}<button class="btn ${next?'':'primary'}" id="retBtn">${win?'Fly again':'Retry'}</button><button class="btn" id="mnuBtn2">Missions</button></div>`;
  const nb=resultSheet.querySelector('#nxtBtn');if(nb)nb.addEventListener('click',()=>{renderBrief(G.mi+1);resultEl.hidden=true;menu.hidden=false});
  resultSheet.querySelector('#retBtn').addEventListener('click',()=>start(G.mi));
  resultSheet.querySelector('#mnuBtn2').addEventListener('click',toMenu);
  resultEl.scrollTop=0;resultEl.hidden=false;
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state!=='pause')update(dt);
  draw();requestAnimationFrame(frame);
}
toMenu();
requestAnimationFrame(frame);
})();
</script>

</body></html>
